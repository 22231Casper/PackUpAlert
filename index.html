<!doctype html>
<html lang="en-nz">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">

        <title>PackUpAlert</title>

        <link type="text/css" rel="stylesheet" href="./main.css">
        <script defer src="./main.js" type="module"></script>
    </head>
    <body>
        <main>
            <span>Next alert:</span>
            <span id="next-alert">loading...</span>
            <span>(<span id="next-alert-relative">loading...</span>)</span>
            <div id="enable-sound-group">
                <input id="enable-sound" type="checkbox" />
                <label for="enable-sound">
                    Enable sound with notifications
                </label>
            </div>
            <span>Alert me <input id="minutes-before-input" type="number" min="0" max="60"> minutes before the bell</span>
        </main>
    </body>
</html>
