<!doctype html>
<html lang="en-nz">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">

        <title>PackUpAlert</title>

        <link type="text/css" rel="stylesheet" href="./main.css">
        <script defer src="./main.js" type="module"></script>
    </head>
    <body>
        <main>
            <p>Next alert:</p>
            <p id="next-alert">10:00</p>
            <p id="next-alert-relative">in 1 minute</p>
            <div id="enable-sound-group">
                <input id="enable-sound" type="checkbox" />
                <label for="enable-sound">
                    Enable sound with notifications
                </label>
            </div>
        </main>
    </body>
</html>
